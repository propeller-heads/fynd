[package]
name = "fynd-bench-harness"
version.workspace = true
edition = "2021"
description = "Runs the routing algorithms over a market and writes a report"
publish = false

[features]
# Per-pool simulation metering, forwarded to fynd-core. The profiler asks for it; the benchmark
# does not, because metering every swap costs time the timings would then carry.
swap-metrics = ["fynd-core/swap-metrics"]

[dependencies]
# `test-utils` is what exposes `Solver::from_recording`, which every solver this crate builds goes
# through. It is not optional: without it there is no harness. It is additive, and cargo unifies
# features, so a whole-workspace build compiles fynd-core with it on for every member.
fynd-core = { workspace = true, features = ["test-utils"] }
fynd-test-fixtures.workspace = true

chrono.workspace = true
clap.workspace = true
futures.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
num_cpus.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
tycho-simulation.workspace = true

# Report generators with their own CLI, not sets of timed micro-benchmarks. `harness = false` keeps
# libtest out of them; `cargo bench` is here for the optimised build.
[[bench]]
name = "algorithm_bench"
harness = false

[[bench]]
name = "profile"
harness = false
