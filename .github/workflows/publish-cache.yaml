name: Publish cache

# Keeps a warm build cache for the verify-crates job in release.yaml.
#
# release.yaml runs on a new tag. A tag run can read only its own caches and the caches of main,
# so it cannot use the cache of an earlier release, and every publish verified the crates from a
# cold start: about 18 minutes, 12 of them for the `fynd` crate. This workflow runs the same
# command as verify-crates (`scripts/publish-crates.sh --dry-run`) on main and saves its build
# cache under the same key prefix.
#
# The exact key does not match on a release: rust-cache hashes [workspace.package] version and the
# versions in [workspace.dependencies], and a release changes them. verify-crates restores the
# newest cache with the same prefix instead, which has every dependency already compiled, so only
# the workspace crates compile again. The prefix needs the same runner, actions, toolchain, and
# CARGO_* / RUST* variables as verify-crates.
#
# This cache never reaches the job that has the registry token: publish-crates runs without it.
# The dry run uploads nothing and uses no secrets.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - ".github/workflows/publish-cache.yaml"
      - "scripts/publish-crates.sh"
  # GitHub removes a cache that no run reads for 7 days.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: publish-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Warm the publish cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: publish-verify
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify the crates as verify-crates does
        run: scripts/publish-crates.sh --dry-run
