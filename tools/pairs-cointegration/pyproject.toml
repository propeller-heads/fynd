[project]
name = "pairs-cointegration"
version = "0.1.0"
description = "Search and report cointegration in Fynd executable quote histories"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.3",
  "plotly==6.9.0",
  "pyarrow==25.0.0",
  "statsmodels==0.14.6",
]

[project.scripts]
pairs-cointegration = "pairs_cointegration.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.21",
  "ty==0.0.58",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairs_cointegration"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]

[tool.ty.environment]
python-version = "3.13"
