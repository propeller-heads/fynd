name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  tests-and-lints:
    uses: ./.github/workflows/ci.yaml

  # Opens/updates a release PR on a normal push; on merge, creates a single tag + GitHub
  # Release, which triggers release.yaml to publish crates + npm. Never commits to main.
  # Auto-detects rust -> release-plz.
  release:
    uses: propeller-heads/ci-cd-templates/.github/workflows/release-v3.yaml@main
    permissions:
      contents: read
    secrets:
      app_id: ${{ secrets.APP_ID }}
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  # Rewrites the release PR's newest CHANGELOG.md section with an LLM (OpenRouter) after
  # release-plz has updated the PR. Falls back to release-plz's notes when the API key is
  # missing or the LLM call fails. release-plz rebuilds the PR on each push to main.
  llm-release-notes:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: llm-release-notes
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Find release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label release \
            --json headRefName --jq '.[0].headRefName // empty')"
          if [ -z "$branch" ]; then
            echo "No open release PR; skipping LLM release notes." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release PR branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Write release notes with an LLM
        if: steps.pr.outputs.found == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          set -euo pipefail
          node .github/release/llm-release-notes.mjs CHANGELOG.md

      - name: Push release notes
        if: steps.pr.outputs.found == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): write release notes with an LLM"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${BRANCH}"
