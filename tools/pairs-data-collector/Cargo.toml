[package]
name = "pairs-data-collector"
version.workspace = true
edition = "2021"
description = "Block-by-block executable curve collector backed by an embedded Fynd solver"
license = "MIT"

[dependencies]
fynd-core = { workspace = true }
tycho-simulation = { workspace = true }

alloy = { workspace = true, features = ["provider-ws", "pubsub", "rpc-types-eth"] }
futures = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pairs-data-collector"
path = "src/main.rs"
