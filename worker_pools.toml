# Worker pools configuration file
#
# NOTE: This file is also inlined as the built-in default in fynd-rpc/src/config.rs
# (DEFAULT_WORKER_POOLS_TOML). That constant is used as a fallback when this file is
# not found at runtime (e.g. `cargo install`, Docker). Keep the two in sync.

# Worker pools
[pools.bellman_ford_2_hops]
algorithm = "bellman_ford"
num_workers = 3
task_queue_capacity = 1000
max_hops = 2
timeout_ms = 500

# Example: an exclusive-access worker pool whose workers also route through exclusive components
# to capture surplus above the committed public reference. Worker pools with the key omitted
# default to "public_only": their workers drop exclusive components.
#
# Such a worker pool is only dispatched to for requests granted exclusive access, so size
# num_workers to that share of flow, not to total flow. At least one worker pool must be
# public — an all-exclusive configuration is rejected at startup.
# [pools.exclusive_access]
# algorithm = "bellman_ford"
# num_workers = 3
# max_hops = 2
# timeout_ms = 500
# liquidity_scope = "include_exclusive"

# Example: a worker pool that never routes through a protocol system. An entry names a system
# exactly ("uniswap_v2"), or a whole family when it ends with ":" — "propammfallback:" covers
# every venue on the PropAMMRouter. Absent = no restriction, which is the default.
# [pools.no_pamm]
# algorithm = "bellman_ford"
# num_workers = 3
# max_hops = 2
# timeout_ms = 500
# exclude_protocols = ["propammfallback:"]

