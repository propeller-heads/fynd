name: Publish cache

# Keeps a warm build cache for the crates.io publish job in release.yaml.
#
# release.yaml runs on a new tag. A tag run can read only its own caches and the caches of main,
# so it cannot use the cache of an earlier release, and every publish verified the crates from a
# cold start: about 18 minutes, 12 of them for the `fynd` crate. This workflow runs the same
# command as the publish job (`scripts/publish-crates.sh`, here with --dry-run) on main and saves
# its build cache under the same key.
#
# The key must match the publish job: same runner, same actions, same toolchain, same CARGO_* and
# RUST* variables. rust-cache sets workspace versions to 0.0.0 in the key, so a release that only
# bumps versions finds this cache.
#
# The dry run uploads nothing and uses no secrets.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - ".github/workflows/publish-cache.yaml"
      - "scripts/publish-crates.sh"
  # GitHub removes a cache that no run reads for 7 days.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: publish-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Warm the publish cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: publish-verify
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify the crates as the publish job does
        run: scripts/publish-crates.sh --dry-run
