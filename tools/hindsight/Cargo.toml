[package]
name = "hindsight"
version.workspace = true
edition = "2021"
description = "Decode solver swaps from on-chain data"
license = "MIT"

[[bin]]
name = "hindsight"
path = "src/main.rs"

[dependencies]
# Fynd integration: re-solve via a running solver (HTTP) or an in-process stepped solver
fynd-client = { workspace = true }
fynd-core = { workspace = true, features = ["experimental"] }
fynd-rpc = { workspace = true }
tycho-simulation = { workspace = true }
# Shared tooling (BPS comparison math, FyndAggregator wrapper)
fynd-tools-common = { workspace = true }
# APEX live batch stage: the shared input-builder + per-component solve (machine-local
# apex-solver path dep behind it — the git-dep swap is the gate before any main merge)
apex-batch = { workspace = true }
num-bigint = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# CLI
clap = { workspace = true }

# RPC & Ethereum
alloy = { workspace = true, features = [
    "providers",
    "provider-http",
    "provider-debug-api",
    "rpc-types-eth",
    "rpc-types-trace",
    "network",
] }

# HTTP (for RPC URL parsing) + metrics server
reqwest = { workspace = true }
actix-web = { workspace = true }

# Prometheus metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Error handling & logging
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Test-only route fixtures (resolve::test_support): a throwaway ProtocolComponent's creation
# timestamp needs a concrete NaiveDateTime.
chrono = { workspace = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"
