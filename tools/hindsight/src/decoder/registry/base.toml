# Base (chain-id 8453) address book for trade decoding. Same structure as ethereum.toml — see it
# and registry.rs for what each section drives. Addresses gathered 2026-07-21.
#
# Accuracy note: a wrong or missing *solver* address only costs coverage (the swap fails to
# match), but a wrong *venue fee wallet* produces wrong records: `[venue_fees]` drives both the
# venue label and the fee correction on the amounts. Every `[venue_fees]` wallet below was
# verified on-chain against live Base swaps (2026-07-21), not assumed from the mainnet book.

# Wrapped-native token: WETH on Base (canonical OP-stack predeploy).
wrapped_native = "0x4200000000000000000000000000000000000006"

# Permit2 — same deterministic address on every chain.
infrastructure = ["0x000000000022d473030f116ddee9f6b43ac78ba3"] # Permit2

# CoW Protocol Settlement — same address on every chain.
batch_settlers = ["0x9008d19f58aabd9ed0d60971565aa8510560ab41"]

# Stablecoins anchoring the native token to USD (address = decimals).
[usd_stablecoins]
"0x833589fcd6edb6e08f4c7c32d4f71b54bda02913" = 6  # USDC (native, Circle)
"0xd9aaec86b65d86f6a7b5b1b0c42ffa531710b6ca" = 6  # USDbC (bridged USDC)
"0x50c5725949a6f0c72e6c4a641f24049a917db0cb" = 18 # DAI

# Solver routers — the venue that actually settles a swap.
[solvers]
# 1inch v6 and v5 Aggregation Routers (same deterministic addresses as mainnet)
"0x111111125421ca6dc452d289314280a0f8842a65" = "1inch"
"0x1111111254eeb25477b68fb85ed929f73a960582" = "1inch"
# 0x Settler AllowanceHolder (same address as mainnet)
"0x0000000000001ff3684f28c67538d4d072c22734" = "0x"
# 0x Settler itself. 0x redeploys Settler and tells integrators not to hardcode it, but Base order
# flow enters through Settler directly as well as through AllowanceHolder — 628 of Coinbase's fee
# legs in an 8k-block sample came from it — so without it those swaps never match. Re-derive from
# 0x's registry (0x00000000000004533Fe15556B1E086BB1A72cEae, `ownerOf(2)`) when coverage drops.
"0x7747f8d2a76bd6345cc29622a946a929647f2359" = "0x"
# CoW Protocol Settlement
"0x9008d19f58aabd9ed0d60971565aa8510560ab41" = "cow"
# ParaSwap Augustus v6.2 (same address as mainnet)
"0x6a000f20005980200259b80c5102003040001068" = "paraswap"
# KyberSwap MetaAggregationRouter v2 (same address as mainnet)
"0x6131b5fae19ea4f9d964eac0408e4408b66337b5" = "kyberswap"
# LiFi Diamond (same address as mainnet)
"0x1231deb6f5749ef6ce6943a275a1d3e7486f4eae" = "lifi"
# Uniswap Universal Router (V1_2) and SwapRouter02 on Base
"0x3fc91a3afd70395cd496c647d5a6cc9d4b2b7fad" = "uniswap"
"0x2626664c2603336e57b271c5c0b26f421741e481" = "uniswap"
# Universal Router 2.0, 2.1.1 (developers.uniswap.org supported-chains table)
"0x6ff5693b99212da76ad316178a184ab56d299b43" = "uniswap"
"0xfdf682f51fe81aa4898f0ae2163d8a55c127fbc7" = "uniswap"
# OKX DEX Router on Base — router and exactOut router (OKX onchain-OS docs)
"0x5e2f47bd7d4b357fcfd0bb224eb665773b1b9801" = "okx"
"0x77449ff075c0a385796da0762bcb46fd5cc884c6" = "okx"
# Tycho (PropellerHeads) router on Base (tycho-execution config/router_addresses.json)
"0x2d3524b9b5dae34b646614eebb1e038d403e4cac" = "tycho"
# Fly (formerly Magpie) DexAggregator — same address on Base and most chains
# (docs.fly.trade/developers/deployments)
"0x20f6ee51340adeed01a59b0e65cb3703f3dc860c" = "fly"
# ButterSwap router (`ButterRouterV31`, verified source) — same address as mainnet. Settles the
# swaps ShapeShift routes through Butter; it is the outermost router in those traces, so its entry
# belongs with `solvers/butter.rs` and not before it.
"0xee0319cf0bca5d09333f9f6277743e8de31bd69a" = "butter"
# LiquidMesh router — same address as mainnet. Settles Trust Wallet's and Binance Wallet's swap
# flow; its entry selector 0x47ee97ff is in no public 4-byte database, so
# `solvers/liquidmesh.rs` reads the router's own event instead.
"0x3d90f66b534dd8482b181e24655a9e8265316be9" = "liquidmesh"

# Venues. Relay's Base contracts are the same addresses as mainnet — Relay docs list the Base
# solver as 0xf70da978…, which is how the deployment was confirmed. Its routers are the Cancun-EVM
# deployment (Base is Cancun), identical to the mainnet book. Relay is not in `[venue_fees]`, so
# its cut is not corrected out of the amounts.
# Binance's DEX Router — the same address as mainnet, and the entry point for the larger share of
# this chain's LiquidMesh flow.
[venues.binance]
entry_points = ["0xb300000b72deaeb607a12d5f54773d1c19c7028d"]

[venues.relay]
entry_points = [
    "0xf5042e6ffac5a625d4e7848e0b01373d8eb9e222",
    "0x3ec130b627944cad9b2750300ecb0a695da522b6",
    "0xb92fe925dc43a0ecde6c8b1a2709c170ec4fff4f",
    "0xccc88a9d1b4ed6b0eaba998850414b24f1c315be",
    "0x58cc3e0aa6cd7bf795832a225179ec2d848ce3e7",
]

# MetaMask Swap Router on Base. Verified on-chain: 25/25 sampled fee-paying swaps entered through
# 0xdb9b1e94… (a contract), paying the fee to 0xe3478b0b… — the mainnet fee wallet 1; mainnet
# wallet 2 is unused on Base. The Basescan-labelled "MetaMaskSwapRouter"
# 0xb1aa0a09d43b6b4f289ef14f2441339acdb551ac is NOT the live entry point on Base.
[venues.metamask]
entry_points = ["0xdb9b1e94b5b69df7e401ddbede43491141047db3"]


# Rabby SwapProxy — same address as mainnet, deployed on Base. Verified on-chain: 837 fee legs in
# a 10k-block sample were paid to 0xcd6b9800… (mainnet fee wallet 1) from the proxy and from
# shared solver routers (1inch, 0x, KyberSwap, Uniswap); the mainnet historical wallet 0x39041f…
# is unused on Base. As on mainnet, only the proxy is an entry point — shared-router Rabby swaps
# are labelled by the fee wallet in `[venue_fees]`, not by tx.to.
[venues.rabby]
entry_points = ["0x02e5be68d46dac0b524905bff209cf47ee6db2a9"]

# Rainbow's own router — same address as mainnet (Rainbow deploys it identically across chains).
# Its input-side fee is kept in the router, never transferred out, so it stays inside `amount_in`.
[venues.rainbow]
entry_points = ["0x00000000009726632680fb29d3f7a9734e3010e2"]

# Venues identified by the fee they take on a shared router. Coinbase's Base App is the heaviest
# such venue on Base by a wide margin — 2942 fee legs in an 8k-block sample, 2292 paid by the LiFi
# Diamond and 628 by the 0x Settler. Its 0.95% cut is skimmed off the SELL token before routing, so
# it is netted out of the input rather than added to the output; before this entry those swaps
# decoded as plain `lifi`/`0x` trades with the fee still inside the amount in, which overstated
# Fynd's savings on that flow.
[venue_fees]
"0x5aafc1f252d544f744d17a4e734afd6efc47ede4" = "coinbase"
# Trust Wallet's 0.7% buy-token fee on its LiquidMesh routes, and ShapeShift's Butter fee receiver
# — both the same wallet as on Ethereum, since both routers are deployed at one address per chain.
# The LiquidMesh swap event states the output net of Trust Wallet's cut, so backing it out is what
# stops the fee from reading as a Fynd win.
"0x73691cee20db22f55a6fd0d5948ab00e0fb973b1" = "trustwallet"
"0xf5aa59151be6515c4ca68a0282cf68b3ea4846fc" = "shapeshift"
# Vultisig's app-wide fee wallet, its only fingerprint on the shared routers it settles through.
"0x8e247a480449c84a5fdd25974a8501f3efa4abb9" = "vultisig"

# LiFi frontends identified by the integrator tag in the LiFi swap event (Infinex's volume is
# heavier on Base than on mainnet). Keys are lowercase. `base-app` is Coinbase's Base App, kept
# alongside its fee wallet above so its LiFi leg still attributes if the fee is ever waived.
[venue_integrators]
"infinex" = "infinex"
"base-app" = "coinbase"

# Venues identified by the appData hash a CoW order carries (appCode names the frontend). CoW
# settles on Base too, and the hash is the same across chains. Keyed by the 32-byte appData hash.
[venue_appdata]
# LlamaSwap (DefiLlama): appCode "DefiLlama".
"0xf249b3db926aa5b5a1b18f3fec86b9cc99b9a8a99ad7e8034242d2838ae97422" = "llamaswap"

# No Base-specific label data yet (display-only tier).
[labels]
