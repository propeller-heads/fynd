[package]
name = "apex-batch"
version.workspace = true
edition = "2021"
description = "Offline APEX batch-clearing surplus analysis over captured hindsight block snapshots"
publish = false

[dependencies]
# Pinned by rev, not branch: the analysis is a long unattended run and a moving branch would make
# two builds of the same fynd commit produce different clearings.
apex-solver = { git = "https://github.com/propeller-heads/apex-solver", rev = "c1e049dd17c5cd0e7f8a037de3d2b0c82d2e3eb7", features = [
    "serde",
    "multithread",
] }

# Market recording replay (raw tycho `Update` messages, zstd-JSON)
fynd-test-fixtures = { workspace = true }
tycho-simulation = { workspace = true }

# Stage 3+: live-state snapshot through the in-process fynd solver
fynd-core = { workspace = true }
fynd-rpc = { workspace = true }
tokio = { workspace = true }
zstd = { workspace = true }

alloy = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
num-bigint = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
