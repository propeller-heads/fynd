name: Validate PR title

on:
  pull_request_target:
    branches:
      - main
      - release/*
    types:
      - opened
      - edited
      - synchronize

jobs:
  validate-pr:
    permissions:
      contents: read
      pull-requests: read
    uses: propeller-heads/ci-cd-templates/.github/workflows/validate-pr.yaml@main
