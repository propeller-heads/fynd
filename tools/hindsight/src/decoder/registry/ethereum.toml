"0x1f8db310f32d48b6180ff902ec60c586128cef47" = "tycho"
"0xfd0b31d2e955fa55e3fa641fe90e08b677188d35" = "tycho"
"0xda892c989d07a18b5dd3f392d949f00df15c5736" = "tycho"

# Venues — platforms that initiate a trade and route it through a solver found in the
# trace. Each section name must have a decode strategy in code (venues::Venue);
# `entry_points` are the contracts users enter through, `fee_collectors` where its fees are sent.

# Display names for entry points that are neither venues nor solvers — market-maker fillers,
# solver contracts, bot routers. Label-only: these must NOT be venues or solvers, because
# known-ness drives strategy selection and filler-entered transactions have to keep matching via
# their solver logs (Intent), not sender netting. Identified from public labels (Etherscan
# tags, Dune spellbook solver lists, project sites), ranked by observed volume in monitor runs.
[labels]
# Kipseli Capital: CoW solver (spellbook) and market-maker filler (Etherscan "Market Intent";
# the 0xbee… vanity family is Kipseli across CoW/1inch listings).
"0xbee162fa5ae892be74f3f3e01c23da89adbccccc" = "kipseli"
"0xbee3211ab312a8d065c4fef0247448e17a8da000" = "kipseli"
# Average Solutions: intent solver for UniswapX / 1inch Fusion (average-solutions.xyz; operated
# by average-solutions.eth).
"0xdeadc0de0000e54725ad1bf220324717043e02bf" = "average-solutions"
# Rizzolver (Wintermute): UniswapX filler, CoW solver, 1inch Fusion resolver.
"0x225a38bc71102999dd13478bfabd7c4d53f2dc17" = "rizzolver"
"0x8f5835e9d756c9bd934bce527157a4b0ef3c5cb7" = "rizzolver"
"0xa8c1c98aaf99a5dfc907d61b892b2ad624901185" = "rizzolver"
# CoW solvers (spellbook cow_protocol_ethereum_solvers).
"0x1921e0ff550c09066edd4df05d304151c45e77de" = "barter"
"0xa9d635ef85bc37eb9ff9d6165481ea230ed32392" = "quasi"
# MEV bots (Etherscan public tags); c0ffeebabe.eth's is the only named operator.
"0xe08d97e151473a848c3d9ca3f323cb720472d015" = "c0ffeebabe"
"0x06cff7088619c7178f5e14f0b119458d08d2f5ef" = "mev-bot"
"0x81463b0f960f247f704377661ec81c1fd65b5128" = "mev-bot"
# Pendle Router V4 (Etherscan name tag) — a protocol router, not a solver.
"0x888888888889758f76e7103c6cbf23abbf58f946" = "pendle"

[venues.relay]
# Relay routers (v2 / v2.1 / v3, Cancun) and approval proxies.
entry_points = [
    "0xf5042e6ffac5a625d4e7848e0b01373d8eb9e222",
    "0x3ec130b627944cad9b2750300ecb0a695da522b6",
    "0xb92fe925dc43a0ecde6c8b1a2709c170ec4fff4f",
    "0xccc88a9d1b4ed6b0eaba998850414b24f1c315be",
    "0x58cc3e0aa6cd7bf795832a225179ec2d848ce3e7",
]
# Relay fee collector (the Relay router takes the fee on the input side). Sole collector across a 25-tx
# on-chain sample; fee ranges ~1–41 bps depending on Relay's fee tier.
fee_collectors = ["0xf70da97812cb96acdf810712aa562db8dfa3dbef"]

[venues.metamask]
# MetaMask Swap Router.
entry_points = ["0x881d40237659c251811cec9c364ef91dc08d300c"]
# MetaMask fee wallets. Both observed in a 28-tx on-chain sample (26 paid one of the two, the
# rest were genuinely fee-free pairs); the fee is ~87.5 bps plus a gas recoup on gasless "smart
# swaps", taken from whichever swap side is native ETH, else from a swap token directly.
fee_collectors = [
    "0xe3478b0bb1a5084567c319096437924948be1964",
    "0xf326e4de8f66a0bdc0970b79e0924e33c79f1915",
]

# MetaMask's router names the solver API behind each swap in a calldata aggregatorId like
# "oneInchV6FeeDynamic" or "okx6". Each entry maps a lowercase substring of that id to a solver
# name used in this address book; ids that match no entry are recorded as-is.
[venues.metamask.solver_aliases]
oneinch = "1inch"
zeroex = "0x"
uniswap = "uniswap"
okx = "okx"
kyber = "kyberswap"
paraswap = "paraswap"
airswap = "airswap"
openocean = "openocean"
hashflow = "hashflow"

[venues.rabby]
# Rabby SwapProxy — the app-owned router `tx.to` for its Uniswap-routed swaps. Rabby also routes
# through shared solver routers (0x, 1inch, Sushi), where `tx.to` is the solver's own contract and
# the only Rabby fingerprint is the fee leg below; those are not keyed here (see rabby.rs).
entry_points = ["0x02e5be68d46dac0b524905bff209cf47ee6db2a9"]
# Rabby fee wallets: a flat 0.25% of the output token. Current wallet confirmed 2026-07-17 via two
# decoded live swaps through different venues; the historical wallet took the fee through ~Sep 2025
# before rotating. Both are listed so trades in either window decode with the fee backed out.
fee_collectors = [
    "0xcd6b980029e6e6e0733ac8ec3e02be9410d09799",
    "0x39041f1b366fe33f9a5a79de5120f2aee2577ebc",
]

[venues.coinbase]
# Coinbase Wallet's swap proxies — the app-owned `tx.to` for its 0x-powered swaps ("aggregation is
# powered by 0x", docs.cdp.coinbase.com). These proxies have been quiet since late 2025 (flow may
# have moved off them — see the Hindsight targets doc); kept so historical trades decode and to
# catch a resumption.
entry_points = [
    "0x8df6084e3b84a65ab9dd2325b5422e5debd8944a",
    "0xe66b31678d6c16e9ebf358268a790b763c133750",
]
# Coinbase's 0x integration fee, taken from the output token and sent to this wallet.
fee_collectors = ["0x382ffce2287252f930e1c8dc9328dac5bf282ba1"]
