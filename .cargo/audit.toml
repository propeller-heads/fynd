[advisories]
# RUSTSEC-2025-0055: tracing-subscriber ^0.2 log poisoning via ANSI escapes
# Dep chain: tycho-simulation <- revm 29 <- revm-precompile 27 <- ark-bn254 0.5 <- ark-r1cs-std
# <- ark-relations 0.5 <- tracing-subscriber ^0.2. ark-r1cs-std is behind ark-bn254's off-by-default
# r1cs feature, so tracing-subscriber 0.2 is in Cargo.lock but never compiled. ark 0.6 uses
# tracing-subscriber 0.3 and revm-precompile 42+ uses ark 0.6; drop this once tycho-simulation
# moves off revm 29.
#
# RUSTSEC-2026-0387: crypto-bigint <0.7.6 may branch on secret values in subtraction, division
# and Montgomery multiplication. Dep chain: alloy-signer <- elliptic-curve 0.13 / k256 0.13 <-
# crypto-bigint ^0.5. k256's scalar arithmetic uses it, so signing with the controller key is in
# scope; exploiting it needs fine-grained timing of the signing process. There is no patched 0.5
# release, and alloy 2.5.0 still requires elliptic-curve 0.13. Drop this once alloy moves to
# elliptic-curve 0.14.
ignore = [
    "RUSTSEC-2025-0055",
    "RUSTSEC-2026-0387",
]
