# Venues — platforms that initiate a trade and route it through a solver found in the trace. Pure
# addresses, no code: `entry_points` are the contracts users enter through. A venue's fees are not
# modelled; see `[venue_fees]` below for the wallets that identify a venue on a shared router.

# Display names for entry points that are neither venues nor solvers — market-maker fillers,
# solver contracts, bot routers. Label-only: these must NOT be venues or solvers, because
# known-ness drives strategy selection and filler-entered transactions have to keep matching via
# their solver logs (Intent), not sender netting. Identified from public labels (Etherscan
# tags, Dune spellbook solver lists, project sites), ranked by observed volume in monitor runs.
[labels]
# Kipseli Capital: CoW solver (spellbook) and market-maker filler (Etherscan "Market Intent";
# the 0xbee… vanity family is Kipseli across CoW/1inch listings).
"0xbee162fa5ae892be74f3f3e01c23da89adbccccc" = "kipseli"
"0xbee3211ab312a8d065c4fef0247448e17a8da000" = "kipseli"
# Average Solutions: intent solver for UniswapX / 1inch Fusion (average-solutions.xyz; operated
# by average-solutions.eth).
"0xdeadc0de0000e54725ad1bf220324717043e02bf" = "average-solutions"
# Rizzolver (Wintermute): UniswapX filler, CoW solver, 1inch Fusion resolver.
"0x225a38bc71102999dd13478bfabd7c4d53f2dc17" = "rizzolver"
"0x8f5835e9d756c9bd934bce527157a4b0ef3c5cb7" = "rizzolver"
"0xa8c1c98aaf99a5dfc907d61b892b2ad624901185" = "rizzolver"
# CoW solvers (spellbook cow_protocol_ethereum_solvers).
"0x1921e0ff550c09066edd4df05d304151c45e77de" = "barter"
"0xa9d635ef85bc37eb9ff9d6165481ea230ed32392" = "quasi"
# MEV bots (Etherscan public tags); c0ffeebabe.eth's is the only named operator.
"0xe08d97e151473a848c3d9ca3f323cb720472d015" = "c0ffeebabe"
"0x06cff7088619c7178f5e14f0b119458d08d2f5ef" = "mev-bot"
"0x81463b0f960f247f704377661ec81c1fd65b5128" = "mev-bot"
# Pendle Router V4 (Etherscan name tag) — a protocol router, not a solver.
"0x888888888889758f76e7103c6cbf23abbf58f946" = "pendle"

[venues.relay]
# Relay routers (v2 / v2.1 / v3, Cancun) and approval proxies.
entry_points = [
    "0xf5042e6ffac5a625d4e7848e0b01373d8eb9e222",
    "0x3ec130b627944cad9b2750300ecb0a695da522b6",
    "0xb92fe925dc43a0ecde6c8b1a2709c170ec4fff4f",
    "0xccc88a9d1b4ed6b0eaba998850414b24f1c315be",
    "0x58cc3e0aa6cd7bf795832a225179ec2d848ce3e7",
]

[venues.metamask]
# MetaMask Swap Router.
entry_points = ["0x881d40237659c251811cec9c364ef91dc08d300c"]


[venues.rabby]
# Rabby SwapProxy — the app-owned router `tx.to` for its Uniswap-routed swaps. Rabby also routes
# through shared solver routers (0x, 1inch, Sushi), where `tx.to` is the solver's own contract and
# only the proxy is an entry point, so those swaps are labelled by the fee wallet below.
entry_points = ["0x02e5be68d46dac0b524905bff209cf47ee6db2a9"]

[venues.coinbase]
# Coinbase Wallet's swap proxies — the app-owned `tx.to` for its 0x-powered swaps ("aggregation is
# powered by 0x", docs.cdp.coinbase.com). These proxies have been quiet since late 2025 (flow may
# have moved off them — see the Hindsight targets doc); kept so historical trades decode and to
# catch a resumption.
entry_points = [
    "0x8df6084e3b84a65ab9dd2325b5422e5debd8944a",
    "0xe66b31678d6c16e9ebf358268a790b763c133750",
]

[venues.rainbow]
# Rainbow's own router ("Rainbow: Router"; same address on ETH/Base/Arb/OP/Polygon). It wraps 0x
# and takes its fee on the input side, keeping it in the router rather than transferring it out.
# With no transfer there is no fee wallet to match, so the cut stays inside `amount_in`.
entry_points = ["0x00000000009726632680fb29d3f7a9734e3010e2"]

[venues.definitive]
# Definitive (definitive.fi) — a non-custodial trading platform that mints one segregated trading
# vault per client per chain, all clones of the same 82-byte proxy, from its vault factory
# `0xdef00000cc0a125ba7962e8113d3b69786851736` ("Definitive: Vault Factory"). `tx.to` is the
# client's own vault, so every client is a separate address here and this list covers only the
# vaults observed so far — a Definitive trade through an unlisted vault stays unmatched.
#
# The transaction sender is never the client: Definitive routes each fill through a rotating proxy
# ("Performer Address") to mask order flow (docs.definitive.fi/institutions-and-funds), so the
# sender carries no venue signal and the vault is the only fingerprint.
entry_points = ["0x7957e5a88f0389997b352315e70ab20d77ec410a"]

# Order-flow venues identified by the trader address that owns the order, not by tx.to. kpk is a
# treasury manager whose Safes trade through CoW: tx.from is the CoW solver, so the venue is only
# visible as the Safe owning the settled order. Addresses from docs.kpk.io / karpatkey.
[venue_owners]
"0x4f2083f5fbede34c2714affb3105539775f7fe64" = "kpk" # ENS Endowment
"0x38f6a1b46144faee6a6d9f79d8de264c18e23848" = "kpk" # USD Alpha
"0x99b9f5f24205cb88e33b1cc72008f644fc23768b" = "kpk" # ETH Alpha

# Venues identified by the fee they take on a shared router (0x): the entry point is 0x's shared
# AllowanceHolder, so the only fingerprint is the fee transfer to the venue's wallet. Recognized
# inside a matched solver trade (never a bare transfer), so the dust-spray gotcha does not apply.
# The fee is taken from the output (buy) token and backed out so the settled output is gross.
[venue_fees]
# Phantom: 0.85% buy-token fee. Current wallet confirmed 2026-07-17; earlier wallet retired
# 2025-07-25 — both kept so either window decodes.
"0x2cffed5d56eb6a17662756ca0fdf350e732c9818" = "phantom"
"0x7afa9d836d2fccf172b66622625e56404e465dbd" = "phantom"
# Robinhood Wallet: fee wallet confirmed 2026-07-17 (swaps are ERC-4337; identify by the fee leg,
# never the bundler sender).
"0xad01c20d5886137e056775af56915de824c8fce5" = "robinhood"
# Coinbase's Base App (the renamed Coinbase Wallet), whose current flow the venue section above no
# longer catches: 943 fee legs in an 8k-block sample, 516 paid by the LiFi Diamond and 380 by the 0x
# Settler. Unlike Phantom's and Robinhood's, this 0.95% cut is skimmed off the SELL token before
# routing, so it is netted out of the input rather than added to the output.
"0x5aafc1f252d544f744d17a4e734afd6efc47ede4" = "coinbase"

# Venues identified by the integrator tag a provider records in its swap event. LiFi frontends
# route through the shared LiFi Diamond, so the integrator string in LiFiGenericSwapCompleted /
# LiFiSwappedGeneric is the only fingerprint. Keys are lowercase (matched case-insensitively).
[venue_integrators]
"infinex" = "infinex"
"robinhood" = "robinhood"
# Coinbase's Base App, kept alongside its fee wallet above so its LiFi leg still attributes if the
# fee is ever waived.
"base-app" = "coinbase"

# Venues identified by the appData hash a CoW order carries: appCode names the frontend that
# built the order. CoW commits this hash into each order; it appears in the settle calldata, not
# the Trade event. Keyed by the 32-byte appData hash.
[venue_appdata]
# LlamaSwap (DefiLlama): appCode "DefiLlama". A low-frequency, fee-free frontend whose other legs
# (0x, Kyber) tag it only off-chain, so this CoW hash is its one on-chain fingerprint.
"0xf249b3db926aa5b5a1b18f3fec86b9cc99b9a8a99ad7e8034242d2838ae97422" = "llamaswap"
