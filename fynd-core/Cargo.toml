[package]
name = "fynd-core"
version.workspace = true
edition = "2021"
description = "Core solving logic for Fynd DEX router"
license = "MIT"
readme = "README.md"
# Integration tests and their Git LFS fixtures are dev-only; excluding them keeps
# the published crate lean and stops `cargo publish` from dirty-checking the
# LFS fixture (whose smudge state differs on the release runner).
exclude = ["tests/"]

[dependencies]
tycho-simulation.workspace = true
petgraph.workspace = true
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
num_cpus.workspace = true
async-channel.workspace = true
async-trait.workspace = true
itertools.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
typetag.workspace = true
tycho-execution.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
alloy = { workspace = true, features = ["sol-types", "signer-local"] }

[features]
# Default-on so the replayed-market test binary uses the same allocator as the `fynd` binary,
# which defaults jemalloc on too. `#[global_allocator]` binds per binary crate, and the
# integration test binary is its own crate — without this it would silently measure the system
# allocator while the production binary used jemalloc. Only affects the test target; the
# dependency is a dev-dependency, so nothing reaches consumers of this crate.
default = ["jemalloc"]
jemalloc = []
test-utils = []
# Block-step-controller build path: lets a caller release buffered blocks one at
# a time (deterministic stepping). Used by the hindsight monitor; the API is not
# yet stable, so it is opt-in.
experimental = []

[dev-dependencies]
tikv-jemallocator.workspace = true
rstest.workspace = true
tempfile.workspace = true
toml.workspace = true
fynd-test-fixtures.workspace = true
tracing-subscriber.workspace = true
metrics-util.workspace = true
